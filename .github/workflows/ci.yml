name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: homebrew/actions/setup-homebrew@master
      - run: brew style Formula/atpcid.rb
      - run: brew audit --formula atpcid
